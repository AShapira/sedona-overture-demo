services:
  lab:
    image: ${SEDONA_IMAGE:-docker.io/apache/sedona:1.9.0@sha256:a1acf172621652c926214259045b2324f75341026dd726db0bef7e21b4205525}
    working_dir: /workspace
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --IdentityProvider.token=
      - --ServerApp.password=
      - --LabApp.extension_manager=readonly
    ports:
      - 127.0.0.1:${JUPYTER_PORT:-8888}:8888
      - 127.0.0.1:${SPARK_UI_PORT:-4040}:4040
    environment:
      PYTHONPATH: /workspace/src:/opt/spark/python
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      OVERTURE_RELEASE_URI: ${OVERTURE_RELEASE_URI:?Set an s3a release URI}
      OVERTURE_RELEASE: ${OVERTURE_RELEASE:-2026-07-22.0}
      REQUIRE_S3_RELEASE: "true"
      SEDONA_SPARK_LOCAL_CORES: ${SEDONA_SPARK_LOCAL_CORES:-8}
      SEDONA_SPARK_DRIVER_MEMORY: ${SEDONA_SPARK_DRIVER_MEMORY:-16g}
      SEDONA_SPARK_PARTITIONS: ${SEDONA_SPARK_PARTITIONS:-16}
      SEDONA_SPARK_LOCAL_DIR: /scratch/spark
      SEDONA_SPARK_LOG_LEVEL: ${SEDONA_SPARK_LOG_LEVEL:-ERROR}
      SEDONA_SCRATCH_DIR: /scratch
      SEDONA_SCRATCH_BUDGET_GB: ${SEDONA_SCRATCH_BUDGET_GB:-20}
      SEDONA_SCRATCH_RESERVE_GB: ${SEDONA_SCRATCH_RESERVE_GB:-2}
      RELEASE_INVENTORY_CACHE: /scratch/inventory
      REFRESH_RELEASE_INVENTORY: ${REFRESH_RELEASE_INVENTORY:-false}
      INVENTORY_INCLUDE_ROW_COUNTS: ${INVENTORY_INCLUDE_ROW_COUNTS:-false}
      MEDIUM_STATE_CODES: '${MEDIUM_STATE_CODES:?Set MEDIUM_STATE_CODES JSON}'
      SMALL_CITIES: '${SMALL_CITIES:?Set SMALL_CITIES JSON}'
      MEDIUM_SAMPLE_LIMIT: ${MEDIUM_SAMPLE_LIMIT:?Set MEDIUM_SAMPLE_LIMIT}
      SMALL_SAMPLE_LIMIT: ${SMALL_SAMPLE_LIMIT:?Set SMALL_SAMPLE_LIMIT}
      MAP_FEATURE_LIMIT: ${MAP_FEATURE_LIMIT:-2000}
      WMS_URL: ${WMS_URL:-}
      WMS_LAYERS: '${WMS_LAYERS:-}'
      WMS_SRS: ${WMS_SRS:-EPSG:3857}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the air-gap S3 endpoint}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      S3_SSL_ENABLED: ${S3_SSL_ENABLED:-true}
      WRITE_DERIVED: ${WRITE_DERIVED:-false}
      DERIVED_OUTPUT_MODE: ${DERIVED_OUTPUT_MODE:-s3}
      DERIVED_OUTPUT_URI: ${DERIVED_OUTPUT_URI:-}
      ALLOW_LOCAL_DERIVED_FALLBACK: ${ALLOW_LOCAL_DERIVED_FALLBACK:-false}
      DERIVED_LOCAL_FALLBACK_DIR: /scratch/derived
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${SEDONA_SCRATCH_HOST_DIR:?Set a Windows scratch directory}
        target: /scratch
    security_opt:
      - no-new-privileges
    mem_limit: ${LAB_CONTAINER_MEMORY:-24g}
    cpus: ${LAB_CONTAINER_CPUS:-8}
