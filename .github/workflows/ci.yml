name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python and generated notebooks
        run: |
          python -m compileall -q src tests scripts qgis/schema-1.18.0
          python qgis/schema-1.18.0/generate_styles.py --check
          python -m unittest discover -s tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
          node --check scripts/check-notebook-maps.cjs
